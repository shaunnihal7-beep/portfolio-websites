<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Aureon — AI-Native Finance Intelligence</title>
    <meta
      name="description"
      content="Aureon is the intelligence layer for modern capital. Predictive models, autonomous risk and adaptive execution — engineered for institutions that move first."
    />
    <link rel="canonical" href="https://aureon.example.com/" />
    <meta name="theme-color" content="#050508" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aureon" />
    <meta property="og:title" content="Aureon — AI-Native Finance Intelligence" />
    <meta
      property="og:description"
      content="The intelligence layer for modern capital. Predictive models, autonomous risk and adaptive execution for institutions that move first."
    />
    <meta property="og:url" content="https://aureon.example.com/" />
    <!-- Add an absolute-URL 1200x630 og:image before production deploy -->

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aureon — AI-Native Finance Intelligence" />
    <meta
      name="twitter:description"
      content="The intelligence layer for modern capital. Predictive, autonomous, adaptive."
    />

    <!-- Favicon: orbital mark, inline so there is zero extra request -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23050508'/%3E%3Ccircle cx='16' cy='17' r='8.5' fill='none' stroke='%23c49a58' stroke-width='2.2'/%3E%3Ccircle cx='16' cy='6.5' r='2.4' fill='%23e8cf9e'/%3E%3C/svg%3E"
    />

    <!-- Typography: Clash Display (display) + Satoshi (body) — self-hosted -->
    <link rel="preload" href="/fonts/clash-display-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/satoshi-400.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Structured data (AEO): Organization + WebSite -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://aureon.example.com/#org",
            "name": "Aureon",
            "url": "https://aureon.example.com/",
            "description": "Aureon is a fictional AI-native finance intelligence platform: predictive analytics, autonomous risk and adaptive execution for institutions.",
            "email": "hello@aureon.finance",
            "slogan": "Capital that thinks ahead."
          },
          {
            "@type": "WebSite",
            "@id": "https://aureon.example.com/#site",
            "url": "https://aureon.example.com/",
            "name": "Aureon",
            "publisher": { "@id": "https://aureon.example.com/#org" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="font-family: sans-serif; color: #ece8df; background: #050508; padding: 4rem 2rem; min-height: 100vh">
        <h1>Aureon — AI-Native Finance Intelligence</h1>
        <p>
          Aureon is the intelligence layer for modern capital: predictive models, autonomous risk and adaptive
          execution for institutions that move first. This experience requires JavaScript.
        </p>
        <p>Contact: hello@aureon.finance</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
